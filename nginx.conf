worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # One host only: www duplicates every URL of the apex domain.
    server {
        listen 8080;
        server_name www.umerkhan.io;
        return 301 https://umerkhan.io$request_uri;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Set proper port in HTTP headers to prevent :8080 leak
        port_in_redirect off;
        absolute_redirect off;

        # Pages removed in the 2026 redesign
        location ~ ^/services/?$ { return 301 /; }
        location ~ ^/projects/?$ { return 301 /apps/; }
        location ~ ^/store(/.*)?$ { return 301 /apps/; }
        location = /llm.txt { return 301 /llms.txt; }

        # Static site: an unknown path is a real 404, never the home page
        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Handle 404
        error_page 404 /404.html;
    }
}
